name: Build 黄昏 APK
on:
  push:
    branches: [ dev ]
  workflow_dispatch:

# dev 分支提交和手动触发都会构建一个可直接安装的通用 Staging APK。
concurrency:
  group: huanghun-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Set up Android SDK build tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0"
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes nasm
      - name: Configure Android SDK path
        run: echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Restore native build cache
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cxx
          key: ${{ runner.os }}-android-native-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle', 'settings.gradle', 'TMessagesProj/build.gradle', 'TMessagesProj/jni/**') }}
          restore-keys: |
            ${{ runner.os }}-android-native-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        env:
          NATIVE_TARGET: universal
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: ./gradlew :TMessagesProj:assembleStaging --no-daemon --parallel --build-cache
      - name: Verify directly installable universal APK
        shell: bash
        run: |
          shopt -s nullglob
          apks=(TMessagesProj/build/outputs/apk/staging/*-universal.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one universal staging APK, found ${#apks[@]}" >&2
            find TMessagesProj/build/outputs/apk/staging -type f -name '*.apk' -print >&2
            exit 1
          fi
          apk="${apks[0]}"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk"
          certs="$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$apk")"
          printf '%s\n' "$certs"
          if grep -q 'CN=Android Debug' <<< "$certs"; then
            echo "WARNING: release signing secrets are unavailable; this APK is debug-signed. It can be installed on a clean device, but it cannot update an APK signed with another certificate." >&2
            echo '### APK 签名' >> "$GITHUB_STEP_SUMMARY"
            echo '当前 Staging APK 使用 Android Debug 证书；请配置 RELEASE_KEYSTORE_BASE64、KEYSTORE_PASS、ALIAS_NAME 和 ALIAS_PASS 后再覆盖安装正式版。' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### APK 签名' >> "$GITHUB_STEP_SUMMARY"
            echo '当前 Staging APK 使用发布证书，可覆盖更新同一签名的旧版本。' >> "$GITHUB_STEP_SUMMARY"
          fi
          sha256sum "$apk" > "$apk.sha256"
          ls -lh "$apk" "$apk.sha256"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 黄昏-可直接安装通用APK
          path: |
            TMessagesProj/build/outputs/apk/staging/*-universal.apk
            TMessagesProj/build/outputs/apk/staging/*-universal.apk.sha256
          if-no-files-found: error
