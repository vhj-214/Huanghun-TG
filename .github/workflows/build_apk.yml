name: Build 黄昏 APK
on:
  workflow_dispatch:

# 自动构建由 staging.yml 负责；本工作流仅保留给手动构建使用。
concurrency:
  group: huanghun-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Set up Android SDK build tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0"
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes nasm
      - name: Configure Android SDK path
        run: echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Restore native build cache
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cxx
          key: ${{ runner.os }}-android-native-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle', 'settings.gradle', 'TMessagesProj/build.gradle', 'TMessagesProj/jni/**') }}
          restore-keys: |
            ${{ runner.os }}-android-native-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: ./gradlew :TMessagesProj:assembleStaging --no-daemon --parallel --build-cache
      - name: Verify installable architecture APKs
        shell: bash
        run: |
          shopt -s nullglob
          apks=(
            TMessagesProj/build/outputs/apk/staging/*-arm64-v8a.apk
            TMessagesProj/build/outputs/apk/staging/*-x86_64.apk
          )
          if [ "${#apks[@]}" -ne 2 ]; then
            echo "Expected arm64-v8a and x86_64 staging APKs, found ${#apks[@]}" >&2
            find TMessagesProj/build/outputs/apk/staging -type f -name '*.apk' -print >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            test -s "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
            sha256sum "$apk" > "$apk.sha256"
          done
          ls -lh "${apks[@]}"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 黄昏-可安装双架构APK
          path: |
            TMessagesProj/build/outputs/apk/staging/*-arm64-v8a.apk
            TMessagesProj/build/outputs/apk/staging/*-arm64-v8a.apk.sha256
            TMessagesProj/build/outputs/apk/staging/*-x86_64.apk
            TMessagesProj/build/outputs/apk/staging/*-x86_64.apk.sha256
          if-no-files-found: error
