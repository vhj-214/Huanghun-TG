name: Build 黄昏 APK
on:
  push:
    branches: [ dev ]
  workflow_dispatch:

# dev 分支提交和手动触发都会构建一个可直接安装的通用 Staging APK。
concurrency:
  group: huanghun-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Set up Android SDK build tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0"
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes nasm
      - name: Configure Android SDK path
        run: echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Restore native build cache
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cxx
          key: ${{ runner.os }}-android-native-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle', 'settings.gradle', 'TMessagesProj/build.gradle', 'TMessagesProj/jni/**') }}
          restore-keys: |
            ${{ runner.os }}-android-native-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        env:
          NATIVE_TARGET: universal
        run: ./gradlew :TMessagesProj:assembleStaging --no-daemon --parallel --build-cache
      - name: Verify directly installable universal APK
        shell: bash
        run: |
          shopt -s nullglob
          apks=(TMessagesProj/build/outputs/apk/staging/*-universal.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one universal staging APK, found ${#apks[@]}" >&2
            find TMessagesProj/build/outputs/apk/staging -type f -name '*.apk' -print >&2
            exit 1
          fi
          apk="${apks[0]}"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk"
          certs="$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$apk")"
          printf '%s\n' "$certs"
          expected_cert='7fa62028311565d639602a6b99770e635be9b478b58c31a870529222d39b415a'
          if grep -q 'CN=Android Debug' <<< "$certs" && grep -q "Signer #1 certificate SHA-256 digest: $expected_cert" <<< "$certs"; then
            echo '### APK 签名' >> "$GITHUB_STEP_SUMMARY"
            echo "已验证使用固定 Staging Debug 证书签名（SHA-256: $expected_cert）。连续 Staging 构建可保持相同签名。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Unexpected Staging signing certificate; expected SHA-256 $expected_cert: $apk" >&2
            echo 'APK 签名异常：证书与固定的 Staging Debug 密钥不一致，已阻止发布。' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          sha256sum "$apk" > "$apk.sha256"
          ls -lh "$apk" "$apk.sha256"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 黄昏-可直接安装通用APK
          path: |
            TMessagesProj/build/outputs/apk/staging/*-universal.apk
            TMessagesProj/build/outputs/apk/staging/*-universal.apk.sha256
          if-no-files-found: error
