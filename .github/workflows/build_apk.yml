name: Build 黄昏 APK
on:
  push:
    branches: [ dev ]
  workflow_dispatch:

# dev 分支提交和手动触发都会构建一个可直接安装的通用 Staging APK。
concurrency:
  group: huanghun-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Set up Android SDK build tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0"
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes nasm
      - name: Configure Android SDK path
        run: echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Restore native build cache
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cxx
          key: ${{ runner.os }}-android-native-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle', 'settings.gradle', 'TMessagesProj/build.gradle', 'TMessagesProj/jni/**') }}
          restore-keys: |
            ${{ runner.os }}-android-native-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        env:
          NATIVE_TARGET: universal
          COMMIT_ID: ${{ github.sha }}
        run: ./gradlew :TMessagesProj:assembleStaging --no-daemon --parallel --build-cache
      - name: Verify directly installable universal APK
        shell: bash
        run: |
          shopt -s nullglob
          apks=(TMessagesProj/build/outputs/apk/staging/*-universal.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one universal staging APK, found ${#apks[@]}" >&2
            find TMessagesProj/build/outputs/apk/staging -type f -name '*.apk' -print >&2
            exit 1
          fi
          apk="${apks[0]}"
          test -s "$apk"
          unzip -t "$apk"
          package_info="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | head -n 1)"
          printf 'APK package: %s\n' "$package_info"
          if ! grep -q "^package: name='com.Huanghun' " <<< "$package_info"; then
            echo "Unexpected APK package; expected com.Huanghun: $package_info" >&2
            exit 1
          fi
          version_code="$(sed -nE "s/.*versionCode='([0-9]+)'.*/\\1/p" <<< "$package_info")"
          if [[ -z "$version_code" || "$version_code" -lt 1263 ]]; then
            echo "APK versionCode must be at least 1263; refusing a downgrade: $package_info" >&2
            exit 1
          fi
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            if ! unzip -Z1 "$apk" | grep "^lib/$abi/" >/dev/null; then
              echo "Universal APK is missing native libraries for $abi: $apk" >&2
              exit 1
            fi
          done
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk"
          certs="$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$apk")"
          printf '%s\n' "$certs"
          expected_cert='52013a967b6f40d49ea4afa88d14e3149d14455d56d6eceebd3a4e89f26314c7'
          if grep -q "Signer #1 certificate SHA-256 digest: $expected_cert" <<< "$certs"; then
            echo '### APK 签名' >> "$GITHUB_STEP_SUMMARY"
            echo "已验证使用用户提供的 MT JKS 签名（SHA-256: $expected_cert）。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Unexpected Staging signing certificate; expected SHA-256 $expected_cert: $apk" >&2
            echo 'APK 签名异常：证书与用户提供的 MT JKS 不一致，已阻止发布。' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ls -lh "$apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 黄昏-可直接安装通用APK
          path: |
            TMessagesProj/build/outputs/apk/staging/*-universal.apk
          if-no-files-found: error
