name: Build Huanghun APK
on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Remove signing requirement
        run: |
          sed -i 's/signingConfig signingConfigs.release//g' TMessagesProj/build.gradle
          sed -i '/signingConfigs {/,/}/d' TMessagesProj/build.gradle
      - name: Build with Gradle
        run: ./gradlew :TMessagesProj:assembleDebug -PnativeTarget=arm64-v8a --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Huanghun-APK
          path: TMessagesProj/build/outputs/apk/debug/*.apk
