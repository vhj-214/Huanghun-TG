<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>数据格式说明</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { min-height: 100vh; background: #02040c; color: #fff; font-family: system-ui, Consolas, monospace; overflow-x: hidden; display: flex; align-items: center; justify-content: center; position: relative; padding: 24px 0; }
#particles-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
.orb-ring-1, .orb-ring-2 { position: fixed; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
.orb-ring-1 { width: 1600px; height: 1600px; background: radial-gradient(circle, rgba(0,170,255,.12) 0%, transparent 70%); filter: blur(80px); animation: spinSlow 30s linear infinite; }
.orb-ring-2 { width: 1200px; height: 1200px; background: radial-gradient(circle, rgba(130,60,255,.09) 0%, transparent 65%); filter: blur(60px); animation: spinSlowReverse 22s linear infinite; }
.grid-overlay { position: fixed; inset: 0; background-image: linear-gradient(rgba(0,142,255,.07) 1px, transparent 1px), linear-gradient(90deg,rgba(0,142,255,.07) 1px, transparent 1px); background-size: 60px 60px; animation: gridMove 12s linear infinite; }
@keyframes spinSlow { from { transform: translate(-50%,-50%) rotate(0deg); } to { transform: translate(-50%,-50%) rotate(360deg); } }
@keyframes spinSlowReverse { from { transform: translate(-50%,-50%) rotate(0deg); } to { transform: translate(-50%,-50%) rotate(-360deg); } }
@keyframes gridMove { from { background-position: 0 0; } to { background-position: 60px 60px; } }
.wrap { position: relative; z-index: 2; width: min(94%, 800px); perspective: 1400px; }
.main-card { background: linear-gradient(145deg, rgba(14,22,48,.75), rgba(4,8,22,.82)); border: 1px solid rgba(0,195,255,.3); border-radius: 24px; padding: 44px 34px; backdrop-filter: blur(20px); box-shadow: 0 0 80px rgba(0,150,255,.22), 0 0 140px rgba(110,40,255,.12), inset 0 0 120px rgba(0,110,210,.07); animation: cardFloat 8s ease-in-out infinite; }
@keyframes cardFloat { 0%,100% { transform: rotateX(3deg) rotateY(-2deg) translateY(0); } 50% { transform: rotateX(-3deg) rotateY(2deg) translateY(-10px); } }
.page-title { text-align: center; font-size: clamp(30px, 6vw, 46px); font-weight: 800; margin-bottom: 16px; background: linear-gradient(90deg,#36d0ff,#b27bff,#22e8ff); background-size: 200% auto; -webkit-background-clip: text; color: transparent; animation: textShine 3.2s linear infinite; letter-spacing: 3px; }
@keyframes textShine { from { background-position: 0 center; } to { background-position: 200% center; } }
.page-note { color: #a7c9e8; text-align: center; font-size: 14px; line-height: 1.65; margin: 0 auto 38px; max-width: 590px; }
.block-item { margin-bottom: 28px; }
.block-label { color: #72c8ff; font-size: 17px; margin-bottom: 12px; letter-spacing: 1.5px; text-shadow: 0 0 12px rgba(0,160,255,.4); }
.flex-row { display: flex; gap: 14px; align-items: center; }
.code-container { flex: 1; background: rgba(0,24,52,.7); border: 1px solid rgba(0,200,255,.35); border-radius: 14px; padding: 18px 20px; font-family: Consolas,monospace; color: #48f0ff; word-break: break-all; box-shadow: inset 0 0 30px rgba(0,140,240,.11), 0 0 18px rgba(0,175,255,.14); position: relative; overflow: hidden; }
.code-container::after { content: ""; position: absolute; top: -100%; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, transparent, rgba(0,210,255,.18), transparent); animation: scanLine 3.5s linear infinite; }
@keyframes scanLine { from { top: -100%; } to { top: 100%; } }
.copy-button { padding: 16px 24px; border: none; border-radius: 12px; background: linear-gradient(135deg,#007cff,#882cff); color: #fff; font-weight: 600; cursor: pointer; white-space: nowrap; }
.copy-button:active { transform: scale(.95); }
.footer-warning { color: #ffcf7b; text-align: center; font-size: 13px; line-height: 1.6; margin-top: 8px; }
.toast-popup { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,224,144,.82); color: #fff; padding: 12px 28px; border-radius: 10px; opacity: 0; pointer-events: none; transition: .35s; z-index: 999; }
.toast-popup.show { opacity: 1; }
@media(max-width:580px) { .main-card { padding: 32px 22px; } .flex-row { flex-direction: column; align-items: stretch; } }
</style>
</head>
<body>
<div id="particles-bg"><div class="orb-ring-1"></div><div class="orb-ring-2"></div><div class="grid-overlay"></div></div>
<div class="wrap"><div class="main-card">
<h1 class="page-title">数据格式说明</h1>
<p class="page-note">以下内容仅用于展示 Cloudflare 账户 ID 与 API 令牌的填写格式。请在凭据页面替换为你自己的有效数据。</p>
<div class="block-item"><div class="block-label">示例账户 ID（32 位）</div><div class="flex-row"><div class="code-container" id="demoId">0123456789abcdef0123456789abcdef</div><button class="copy-button" onclick="copyFunc('demoId')">复制格式</button></div></div>
<div class="block-item"><div class="block-label">示例 API 令牌（cfut_ 前缀）</div><div class="flex-row"><div class="code-container" id="demoToken">cfut_example_token_replace_with_your_own_000000000000000000</div><button class="copy-button" onclick="copyFunc('demoToken')">复制格式</button></div></div>
<p class="footer-warning">演示数据不可用于调用服务，请勿将其当作真实 Cloudflare 凭据。</p>
</div></div>
<div class="toast-popup" id="msgToast">已复制到剪贴板</div>
<script>
const bgDom = document.getElementById('particles-bg');
for (let i = 0; i < 90; i++) { const dot = document.createElement('div'); dot.style.cssText = `position:fixed;border-radius:50%;background:#fff;left:${Math.random()*100}%;top:${Math.random()*100}%;width:${Math.random()*2.6+.3}px;height:${Math.random()*2.6+.3}px;opacity:${Math.random()*.5+.08};z-index:0;`; bgDom.appendChild(dot); }
function copyFunc(id) { const text = document.getElementById(id).innerText; const temp = document.createElement('textarea'); temp.value = text; temp.style.position = 'absolute'; temp.style.left = '-9999px'; document.body.appendChild(temp); temp.select(); const toast = document.getElementById('msgToast'); try { document.execCommand('copy'); toast.textContent = '已复制示例格式'; } catch (e) { toast.textContent = '复制失败，请手动框选文字'; } document.body.removeChild(temp); toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1400); }
</script>
</body>
</html>
