<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#171816" />
  <title>联系作者</title>
  <style>
    :root { --bg:#171816; --card:#22231f; --text:#f0eee7; --sub:#a9aba2; --line:rgba(240,238,231,.18); --accent:#aabf8e; }
    * { box-sizing:border-box; }
    html,body { min-height:100%; margin:0; }
    body { background:radial-gradient(circle at 90% 5%,rgba(170,191,142,.13),transparent 32rem),var(--bg); color:var(--text); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    main { min-height:100svh; display:flex; flex-direction:column; justify-content:center; padding:28px 22px max(34px,env(safe-area-inset-bottom)); }
    .mark { width:38px; height:38px; display:grid; place-items:center; border:1px solid var(--accent); border-radius:50%; color:var(--accent); font-size:19px; }
    h1 { margin:22px 0 8px; font-size:31px; font-weight:650; letter-spacing:.02em; }
    p { margin:0 0 34px; color:var(--sub); font-size:15px; line-height:1.8; }
    .contacts { display:grid; gap:14px; }
    .contact { min-height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 19px; border:1px solid var(--line); border-radius:15px; background:var(--card); color:var(--text); text-decoration:none; font-size:17px; font-weight:600; }
    .contact:active { background:#30322b; border-color:var(--accent); }
    .arrow { color:var(--accent); font-size:23px; font-weight:400; }
    .note { margin-top:22px; color:#85887e; font-size:12px; text-align:center; }
  </style>
</head>
<body>
  <main>
    <div class="mark">✦</div>
    <h1>联系作者</h1>
    <p>请选择下方联系方式，点击后将直接打开 Telegram。</p>
    <section class="contacts" aria-label="作者联系方式">
      <a class="contact" href="https://t.me/NBABB1314"><span>联系方式一</span><span class="arrow">›</span></a>
      <a class="contact" href="tg://user?id=7900751073"><span>联系方式二</span><span class="arrow">›</span></a>
    </section>
    <div class="note">点击按钮即可联系作者</div>
  </main>
</body>
</html>
